<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBC Rotas - Craigavon Baptist Church</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f2b48;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo-container {
      width: 70px;
      height: 70px;
      background: #38b2ac;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
    }
    .logo-container svg {
      width: 36px;
      height: 36px;
      fill: white;
    }
    h1 {
      font-size: 1.5rem;
      color: #0f2b48;
      margin: 0 0 0.25rem 0;
    }
    p.subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #4a5568;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
      background-color: #ebf8ff;
    }
    input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
    }
    button.btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: #0f2b48;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button.btn-submit:hover {
      background-color: #1a365d;
    }
    .error-box {
      display: none;
      margin-top: 1.25rem;
      padding: 0.75rem;
      background-color: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 6px;
      color: #c53030;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- LOGIN CARD -->
  <div id="login-container" class="card">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L4 7v13h16V7l-8-5zm6 16H6V8.5l6-3.75 6 3.75V18z"/>
      </svg>
    </div>
    <h1>CBC Rotas</h1>
    <p class="subtitle">Craigavon Baptist Church Rota Management</p>

    <form id="login-form">
      <div class="form-group">
        <label for="user-name">Your Name</label>
        <input type="text" id="user-name" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="passcode">Passcode</label>
        <input type="password" id="passcode" placeholder="Enter secret passcode" required>
      </div>

      <button type="submit" class="btn-submit">Access Rotas</button>
      <div id="error-message" class="error-box"></div>
    </form>
  </div>

  <!-- DASHBOARD CONTAINER (Hidden until login) -->
  <div id="app-container" style="display: none; padding: 20px; color: white;">
    <h2>Welcome to CBC Rotas</h2>
    <div id="user-display"></div>
  </div>

  <script>
    // 1. Hardcoded Supabase Configuration
    const SUPABASE_URL = "https://ojzwujpahfjmaeisnfez.supabase.co";
    const SUPABASE_KEY = "sb_publishable_87n6hxMnH7uZENhXmNaikw_fCVVQWqZ";

    // Initialize Supabase Client
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. Secret Passcode Definition
    const SECRET_PASSCODE = "1234";

    // Handle Login Submit
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const userName = document.getElementById('user-name').value.trim();
      const enteredPasscode = document.getElementById('passcode').value.trim();
      const errorBox = document.getElementById('error-message');

      // Verify Passcode
      if (enteredPasscode !== SECRET_PASSCODE) {
        errorBox.innerText = "Incorrect passcode. Please try again.";
        errorBox.style.display = "block";
        return;
      }

      // Clear any errors
      errorBox.style.display = "none";

      // Save user session
      sessionStorage.setItem('cbc_user_name', userName);

      // Hide login, show app
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      document.getElementById('user-display').innerText = `Logged in as: ${userName}`;

      // Load database rotas
      loadRotas(userName);
    });

    async function loadRotas(userName) {
      const { data, error } = await supabase.from('rotas').select('*');
      if (error) {
        console.error('Error fetching rotas:', error);
      } else {
        console.log('Rotas data loaded:', data);
      }
    }
  </script>
</body>
</html>
