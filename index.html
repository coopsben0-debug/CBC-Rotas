<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBC Rotas - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#0f2b48] text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border border-slate-200">
    <!-- Church Logo -->
    <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 p-2 shadow-inner border border-slate-200">
      <img src="cbc logo.webp" alt="CBC Logo" class="w-full h-full object-contain rounded-full" onerror="this.onerror=null; this.src='https://via.placeholder.com/80?text=CBC';">
    </div>

    <h1 class="text-2xl font-bold text-[#0f2b48]">CBC Rota Management</h1>
    <p class="text-xs text-slate-500 mb-6 uppercase tracking-wider font-medium">Craigavon Baptist Church</p>

    <form id="login-form" onsubmit="handleLogin(event); return false;" class="space-y-4 text-left">
      <div>
        <label for="user-name" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Your Name</label>
        <input type="text" id="user-name" placeholder="e.g. Ben or Colin" required class="w-full px-4 py-2.5 bg-sky-50/50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#38b2ac]">
      </div>

      <div>
        <label for="passcode" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Passcode</label>
        <input type="password" id="passcode" placeholder="Enter church passcode" required class="w-full px-4 py-2.5 bg-sky-50/50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#38b2ac]">
      </div>

      <button type="submit" class="w-full py-3 bg-[#0f2b48] hover:bg-[#1a365d] text-white text-sm font-semibold rounded-lg shadow-md transition duration-200">
        Access Church Rotas
      </button>

      <div id="error-message" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-lg text-rose-600 text-xs text-center font-medium"></div>
    </form>
  </div>

  <script>
    // Turso Config Embedded for Verification & Optional Future DB Login Checks
    const TURSO_URL = 'https://cbc-rota-coopsben0-debug.aws-eu-west-1.turso.io';
    const TURSO_TOKEN = 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3OTE2NzQ2ODYsImlkIjoiMDFhMTI4MWQtYmMwMS03ZWNmLTlhZWMtMzRiNmI0YWQzOGY1Iiwia2lkIjoiRGl5ZFV0d0owWW9SM0p6RTlIeFE5aHZZWGtyZzlCRkRoajIzcG9pNjEtWSIsInJpZCI6IjBkNGZhNDQyLTdlOTEtNDg2NS1iZDM2LWMwYmVhZTNlMjhmZiJ9._TYe8zjOBZRQXZJvoaABhol7Qc1LXcpAqc6A7-M4na3Hc7D38bGgDlwl2HGl_pWRRPfJ1SmQOnXTe44s37ZCCAlib';
    const SECRET_PASSCODE = "1234";

    // Auto-redirect if already logged in
    if (localStorage.getItem('cbc_user_name')) {
      window.location.href = "rotas.html";
    }

    function handleLogin(event) {
      event.preventDefault();
      const userName = document.getElementById('user-name').value.trim();
      const enteredPasscode = document.getElementById('passcode').value.trim();
      const errorBox = document.getElementById('error-message');

      if (!userName) {
        errorBox.innerText = "Please enter your name.";
        errorBox.classList.remove('hidden');
        return;
      }

      if (enteredPasscode !== SECRET_PASSCODE) {
        errorBox.innerText = "Incorrect passcode. Please try again.";
        errorBox.classList.remove('hidden');
        return;
      }

      // Save user session and navigate to dashboard page
      localStorage.setItem('cbc_user_name', userName);
      window.location.href = "rotas.html";
    }
  </script>
</body>
</html>
