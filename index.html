<!DOCTYPE html>
<html lang="en">
<body>
    <div id="debug">Testing connection...</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Use your Supabase URL
        const SUPABASE_URL = "https://ojzwujpahfjmaeisnfez.supabase.co";
        // REPLACE THIS WITH YOUR NEWLY REGENERATED KEY
        const SUPABASE_ANON_KEY = "YOUR_NEWLY_GENERATED_ANON_KEY";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function runDiagnostic() {
            const display = document.getElementById('debug');
            console.log("Starting connection test...");
            try {
                const { data, error } = await supabase.from('rota_slots').select('*');
                if (error) {
                    display.innerText = "CONNECTION ERROR: " + error.message;
                    console.error("Supabase Error Details:", error);
                } else {
                    display.innerText = "SUCCESS! Found " + data.length + " rows.";
                    console.log("Data returned:", data);
                }
            } catch (err) {
                display.innerText = "CRITICAL FAILURE: " + err.message;
                console.error("Critical Failure:", err);
            }
        }
        runDiagnostic();
    </script>
</body>
</html>
