<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <div id="debug">Connecting to database...</div>

    <script>
        // Configuration
        const SUPABASE_URL = "https://ojzwujpahfjmaeisnfez.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qend1anBhaGZqbWFlaXNuZmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTA5NDMsImV4cCI6MjA5NDU4Njk0M30.VvszGR6MbUnBhKsmsXBikkrjok2-F1bnyS4zOwDX5hg";

        // Main function
        async function loadRota() {
            const display = document.getElementById('debug');
            try {
                // Initialize
                const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // Fetch data from your rota_slots table
                const { data, error } = await supabase.from('rota_slots').select('*');
                
                if (error) {
                    display.innerText = "Error: " + error.message;
                } else {
                    display.innerText = "Success! Found " + data.length + " rows.";
                    console.log(data); // Check your browser console (F12)
                }
            } catch (err) {
                display.innerText = "System Failure: " + err.message;
            }
        }

        // Run when page loads
        loadRota();
    </script>
</body>
