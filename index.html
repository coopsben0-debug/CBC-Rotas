<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="debug" style="font-family: sans-serif; font-size: 20px; padding: 20px;">
        Starting...
    </div>

    <script>
        window.onload = async () => {
            const display = document.getElementById('debug');
            const SUPABASE_URL = "https://ojzwujpahfjmaeisnfez.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qend1anBhaGZqbWFlaXNuZmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTA5NDMsImV4cCI6MjA5NDU4Njk0M30.VvszGR6MbUnBhKsmsXBikkrjok2-F1bnyS4zOwDX5hg";

            try {
                const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                display.innerText = "Attempting to fetch data...";
                
                const { data, error } = await supabase.from('rota_slots').select('*');
                
                if (error) {
                    display.innerText = "Error: " + error.message;
                } else if (!data || data.length === 0) {
                    display.innerText = "Connected, but no data found in 'rota_slots'.";
                } else {
                    display.innerText = "Success! Found " + data.length + " rows.";
                    console.log(data); // View this in your browser console
                }
            } catch (err) {
                display.innerText = "Fatal: " + err.message;
            }
        };
    </script>
</body>
</html>
