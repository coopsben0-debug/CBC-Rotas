<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craigavon Baptist Church | Rota System</title>
    
    <!-- Added Favicon to show the logo on the browser tab -->
    <link rel="icon" href="cbc%20logo.webp" type="image/webp">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --cb-dark-blue: #002D62;
            --cb-light-blue: #00509E;
            --cb-white: #FFFFFF;
            --cb-gray-bg: #F4F7F9;
            --cb-gray-border: #E1E8ED;
            --cb-text-main: #2C3E50;
            --cb-text-muted: #5C6F82;
            --cb-alert: #E74C3C;
            --cb-alert-bg: #FDEDEC;
            --cb-success: #27AE60;
            --cb-accent: #EBF3FC;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cb-gray-bg);
            color: var(--cb-text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Login Gateway --- */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--cb-dark-blue) 0%, var(--cb-light-blue) 100%);
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box {
            background: var(--cb-white);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            height: 80px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .login-box h2 {
            margin-top: 0;
            color: var(--cb-dark-blue);
            font-size: 24px;
            margin-bottom: 10px;
        }

        .login-box p {
            color: var(--cb-text-muted);
            margin-bottom: 25px;
            font-size: 15px;
        }

        #keycode-input {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            border: 2px solid var(--cb-gray-border);
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 4px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        #keycode-input:focus {
            outline: none;
            border-color: var(--cb-light-blue);
        }

        #login-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background-color: var(--cb-light-blue);
            color: var(--cb-white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        #login-btn:hover {
            background-color: var(--cb-dark-blue);
        }

        #login-error {
            color: var(--cb-alert);
            margin-top: 15px;
            display: none;
            font-weight: 600;
            font-size: 14px;
        }

        /* --- Main Layout --- */
        #app-screen {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            padding: 25px 0;
            border-bottom: 3px solid var(--cb-gray-border);
            margin-bottom: 30px;
        }

        .header-logo {
            height: 60px;
            margin-right: 20px;
        }

        .header-text h1 {
            color: var(--cb-dark-blue);
            margin: 0 0 5px 0;
            font-size: 28px;
        }

        .header-text span {
            color: var(--cb-text-muted);
            font-weight: 500;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Personal Rota Finder --- */
        .finder-section {
            background: var(--cb-white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 35px;
            border: 1px solid var(--cb-gray-border);
            border-left: 6px solid var(--cb-light-blue);
        }

        .finder-section h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--cb-dark-blue);
            font-size: 20px;
        }

        .finder-input-row {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .finder-input {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 1px solid var(--cb-gray-border);
            border-radius: 8px;
            transition: border-color 0.2s;
        }

        .finder-input:focus {
            outline: none;
            border-color: var(--cb-light-blue);
        }

        .finder-btn {
            background-color: var(--cb-dark-blue);
            color: var(--cb-white);
            border: none;
            padding: 0 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .finder-btn:hover {
            opacity: 0.9;
        }

        #personal-results-area {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--cb-gray-border);
        }

        .personal-card {
            background-color: var(--cb-accent);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #D5E6F7;
        }

        /* --- Dynamic Tabs --- */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .tab-btn {
            background-color: var(--cb-white);
            color: var(--cb-text-muted);
            border: 1px solid var(--cb-gray-border);
            padding: 12px 20px;
            border-radius: 50px; /* Pill shape */
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--cb-light-blue);
            color: var(--cb-white);
            border-color: var(--cb-light-blue);
            box-shadow: 0 4px 10px rgba(0,80,158,0.2);
        }

        /* --- Tables --- */
        .rota-section {
            background: var(--cb-white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 40px;
            border: 1px solid var(--cb-gray-border);
        }

        .rota-date-header {
            color: var(--cb-dark-blue);
            border-bottom: 2px solid var(--cb-gray-bg);
            padding-bottom: 15px;
            margin-top: 0;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rota-group-title {
            background-color: var(--cb-gray-bg);
            color: var(--cb-text-muted);
            font-weight: 700;
            padding: 10px 15px;
            margin-top: 25px;
            margin-bottom: 0;
            border-radius: 6px 6px 0 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--cb-gray-border);
            border-bottom: none;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            text-align: left;
            padding: 16px 15px;
            border: 1px solid var(--cb-gray-border);
            vertical-align: middle;
            font-size: 15px;
        }

        th {
            background-color: var(--cb-white);
            color: var(--cb-dark-blue);
            font-weight: 600;
            border-top: none;
        }

        tr:hover td {
            background-color: #FAFAFA;
        }

        .needs-cover-row td {
            background-color: var(--cb-alert-bg) !important;
        }

        .details-box {
            font-size: 13px;
            color: var(--cb-text-muted);
            line-height: 1.5;
            background: var(--cb-gray-bg);
            padding: 10px;
            border-radius: 6px;
        }
        
        .details-box strong {
            color: var(--cb-dark-blue);
        }

        /* --- Buttons & Badges --- */
        .action-btn {
            background-color: transparent;
            color: var(--cb-light-blue);
            border: 1px solid var(--cb-light-blue);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .action-btn:hover {
            background-color: var(--cb-light-blue);
            color: var(--cb-white);
        }

        .alert-badge {
            background-color: var(--cb-alert);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }

        /* --- Modal --- */
        #edit-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,45,98,0.6);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--cb-white);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--cb-dark-blue);
            border-bottom: 1px solid var(--cb-gray-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--cb-text-main);
        }

        .form-group input[type="text"], .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--cb-gray-border);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-group input[type="text"]:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--cb-light-blue);
            box-shadow: 0 0 0 3px var(--cb-accent);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
            border-top: 1px solid var(--cb-gray-border);
            padding-top: 20px;
        }

        .save-btn {
            background-color: var(--cb-light-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .save-btn:hover { background-color: var(--cb-dark-blue); }

        .cancel-btn {
            background-color: var(--cb-gray-bg);
            color: var(--cb-text-main);
            border: 1px solid var(--cb-gray-border);
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .cancel-btn:hover { background-color: #E2E8F0; }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--cb-text-muted);
            background: var(--cb-white);
            border-radius: 8px;
            border: 1px dashed var(--cb-gray-border);
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <!-- Updated src to handle spaces safely -->
            <img src="cbc%20logo.webp" alt="CBC Logo" class="login-logo" onerror="this.style.display='none'">
            <h2>Craigavon Baptist</h2>
            <p>Enter connection key code to access layouts.</p>
            <input type="password" id="keycode-input" placeholder="••••">
            <button id="login-btn" onclick="checkCode()">Secure Login</button>
            <p id="login-error">Incorrect key code. Please try again.</p>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <!-- Updated src to handle spaces safely -->
            <img src="cbc%20logo.webp" alt="CBC Logo" class="header-logo" onerror="this.style.display='none'">
            <div class="header-text">
                <h1>Church Rota Hub</h1>
                <span>Live Schedule Dashboard</span>
            </div>
        </header>

        <div class="finder-section">
            <h3>🔍 My Upcoming Dates</h3>
            <p style="margin: 0; font-size: 15px; color: var(--cb-text-muted);">Type your name below to instantly find all your upcoming assigned duties.</p>
            <div class="finder-input-row">
                <input type="text" id="personal-name-input" placeholder="Enter your name (e.g. Ben, Niall, or Kathryn)" class="finder-input" onkeypress="if(event.key === 'Enter') findPersonalSchedule()">
                <button class="finder-btn" onclick="findPersonalSchedule()">Find My Rota</button>
            </div>

            <div id="personal-results-area">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h4 style="margin: 0; color: var(--cb-dark-blue); font-size: 16px;">Your Assignments</h4>
                    <button onclick="clearPersonalSearch()" style="background: none; border: none; color: var(--cb-text-muted); cursor: pointer; font-weight: 600; text-decoration: underline;">Clear Finder</button>
                </div>
                <div id="personal-cards-container"></div>
            </div>
        </div>

        <div class="tabs" id="tabs-container"></div>

        <div id="content-area"></div>
    </div>

    <div id="edit-modal">
        <div class="modal-content">
            <h3 id="modal-title">Edit Assignment</h3>
            <input type="hidden" id="edit-slot-id">
            
            <div class="form-group">
                <label id="modal-role-label" for="edit-names">Assigned Person(s):</label>
                <input type="text" id="edit-names" placeholder="e.g. Niall & Hazel">
            </div>

            <div class="form-group" id="modal-story-group">
                <label for="edit-story">Lesson Story / Topic:</label>
                <input type="text" id="edit-story" placeholder="e.g. Noah's Ark">
            </div>

            <div class="form-group" id="modal-verse-group">
                <label for="edit-verse">Memory Verse:</label>
                <input type="text" id="edit-verse" placeholder="e.g. Genesis 6:9">
            </div>

            <div class="form-group" id="modal-notes-group">
                <label for="edit-notes">Focus Context / Lesson Details:</label>
                <textarea id="edit-notes" rows="3" placeholder="Special requirements, notes, or focus details..."></textarea>
            </div>

            <div class="form-group" style="margin-top: 25px; background: var(--cb-alert-bg); padding: 15px; border-radius: 8px; border: 1px solid #fadbd8;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0;">
                    <input type="checkbox" id="edit-cover-checkbox" style="transform: scale(1.3); accent-color: var(--cb-alert);">
                    <span style="color: var(--cb-alert); font-weight: bold; font-size: 15px;">Flag this slot as "Needs Cover"</span>
                </label>
            </div>

            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="save-btn" onclick="saveSlotChanges()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ojzwujpahfjmaeisnfez.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qend1anBhaGZqbWFlaXNuZmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTA5NDMsImV4cCI6MjA5NDU4Njk0M30.VvszGR6MbUnBhKsmsXBikkrjok2-F1bnyS4zOwDX5hg";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const CHURCH_CODE = "1234"; 

        let globalRotaData = [];
        let currentActiveTab = "Main";

        function checkCode() {
            const val = document.getElementById('keycode-input').value;
            if (val === CHURCH_CODE) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                fetchUpcomingRotas();
            } else {
                document.getElementById('login-error').style.display = 'block';
                document.getElementById('keycode-input').style.borderColor = "var(--cb-alert)";
            }
        }

        async function fetchUpcomingRotas() {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = "<div class='empty-state'>Loading scheduling data from server...</div>";

            const localDate = new Date();
            const yyyy = localDate.getFullYear();
            const mm = String(localDate.getMonth() + 1).padStart(2, '0');
            const dd = String(localDate.getDate()).padStart(2, '0');
            const todayBoundaryStr = `${yyyy}-${mm}-${dd}`;

            const { data, error } = await db
                .from('rotas')
                .select('*')
                .gte('date', todayBoundaryStr)
                .order('date', { ascending: true });

            if (error) {
                contentArea.innerHTML = `<div class='empty-state' style="color:var(--cb-alert);">Database Sync Failure: ${error.message}</div>`;
                return;
            }

            let cleanedRecords = [];
            data.forEach(slot => {
                let currentName = slot.rota_name;
                if (currentName === "Welcome & Preparation" || currentName === "Welcome and Preparation") {
                    if (slot.role && (slot.role.toLowerCase().includes("communion") || slot.role.toLowerCase().includes("table"))) {
                        currentName = "Communion & Table Preparation";
                    } else {
                        currentName = "Welcome Team";
                    }
                }

                cleanedRecords.push({
                    ...slot,
                    slot_date: slot.date, 
                    rota_name: currentName,
                    tracking_id: slot.id
                });
            });

            globalRotaData = cleanedRecords;
            buildDynamicTabs();
            renderFilteredView(currentActiveTab);
        }

        function findPersonalSchedule() {
            const searchName = document.getElementById('personal-name-input').value.trim().toLowerCase();
            const container = document.getElementById('personal-cards-container');
            const resultsArea = document.getElementById('personal-results-area');
            
            if (!searchName) {
                alert("Please enter a name to filter entries.");
                return;
            }

            const matchedSlots = globalRotaData.filter(slot => 
                slot.assigned_persons && slot.assigned_persons.toLowerCase().includes(searchName)
            );

            container.innerHTML = "";
            resultsArea.style.display = "block";

            if (matchedSlots.length === 0) {
                container.innerHTML = `<div class="empty-state">No scheduled assignments located matching "<strong>${searchName}</strong>".</div>`;
                return;
            }

            matchedSlots.sort((a, b) => new Date(a.slot_date) - new Date(b.slot_date));

            matchedSlots.forEach(slot => {
                const parsedDate = new Date(slot.slot_date).toLocaleDateString('en-GB', {
                    weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
                });

                let contextLine = slot.focus_context || slot.notes || slot.details || '';
                if (slot.story) contextLine = `Story: ${slot.story}`;

                const item = document.createElement('div');
                item.className = "personal-card";
                item.innerHTML = `
                    <div>
                        <span class="alert-badge" style="background-color: var(--cb-light-blue);">${slot.rota_name}</span>
                        <div style="font-weight: 700; color: var(--cb-dark-blue); font-size: 16px; margin: 5px 0;">${parsedDate}</div>
                        <div style="font-weight: 500; color: var(--cb-text-main); margin-bottom: 5px;">Role: ${slot.role}</div>
                        <div style="font-size: 13px; color: var(--cb-text-muted);">Focus: <strong>${contextLine || 'Standard Duty'}</strong></div>
                    </div>
                    <button class="action-btn" onclick="openEditModal('${slot.id}')">🔄 Swap / Edit</button>
                `;
                container.appendChild(item);
            });
        }

        function clearPersonalSearch() {
            document.getElementById('personal-name-input').value = "";
            document.getElementById('personal-results-area').style.display = "none";
        }

        function buildDynamicTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            const uniqueRotas = [...new Set(globalRotaData.map(item => item.rota_name))].sort();
            
            let tabsHtml = `<button class="tab-btn ${currentActiveTab === 'Main' ? 'active' : ''}" onclick="switchTab('Main')">All Layouts</button>`;
            
            uniqueRotas.forEach(name => {
                const activeClass = currentActiveTab === name ? 'active' : '';
                tabsHtml += `<button class="tab-btn ${activeClass}" onclick="switchTab('${name}')">${name}</button>`;
            });

            tabsContainer.innerHTML = tabsHtml;
        }

        function switchTab(tabName) {
            currentActiveTab = tabName;
            buildDynamicTabs();
            renderFilteredView(tabName);
        }

        function renderFilteredView(view) {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = ''; 

            let filtered = globalRotaData;
            if (view !== "Main") {
                filtered = globalRotaData.filter(slot => slot.rota_name === view);
            }

            if (filtered.length === 0) {
                contentArea.innerHTML = `<div class="empty-state">No structured roster records found under "<strong>${view}</strong>".</div>`;
                return;
            }

            const groupedByDate = filtered.reduce((acc, row) => {
                if (!acc[row.slot_date]) acc[row.slot_date] = [];
                acc[row.slot_date].push(row);
                return acc;
            }, {});

            const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(a) - new Date(b));

            sortedDates.forEach(rawDate => {
                const slotsForDate = groupedByDate[rawDate];
                const parsedDate = new Date(rawDate);
                const structuredDate = parsedDate.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

                const sectionsMap = slotsForDate.reduce((acc, slot) => {
                    if (!acc[slot.rota_name]) acc[slot.rota_name] = [];
                    acc[slot.rota_name].push(slot);
                    return acc;
                }, {});

                let singleDateHtmlBlock = `
                    <div class="rota-section">
                        <h2 class="rota-date-header">
                            📅 ${structuredDate}
                        </h2>`;

                for (const [sectionTitle, rows] of Object.entries(sectionsMap)) {
                    singleDateHtmlBlock += `
                        <div class="rota-group-title">${sectionTitle}</div>
                        <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 25%;">Role / Assignment Track</th>
                                    <th style="width: 25%;">Assigned Person(s)</th>
                                    <th style="width: 35%;">Focus Context / Lesson Details</th>
                                    <th style="width: 15%; text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    rows.forEach(slot => {
                        const rowStatusClass = slot.needs_cover ? 'needs-cover-row' : '';
                        
                        let coreDetailsDisplay = "—";
                        const checkLowerTitle = sectionTitle.toLowerCase();
                        
                        if (checkLowerTitle.includes("sunday school") || checkLowerTitle.includes("sunday kids")) {
                            coreDetailsDisplay = `
                                <div class="details-box">
                                    <strong>📖 Story:</strong> ${slot.story || '—'}<br>
                                    <strong>🎯 Verse:</strong> ${slot.memory_verse || '—'}
                                </div>`;
                        } else if (slot.focus_context || slot.notes || slot.details) {
                            coreDetailsDisplay = `<div class="details-box"><strong>📌 Note:</strong> ${slot.focus_context || slot.notes || slot.details}</div>`;
                        }

                        singleDateHtmlBlock += `
                            <tr class="${rowStatusClass}">
                                <td><strong>${slot.role}</strong></td>
                                <td>
                                    ${slot.needs_cover ? '<span class="alert-badge">Needs Cover</span><br>' : ''}
                                    ${slot.assigned_persons ? `<span>${slot.assigned_persons}</span>` : '<em style="color:var(--cb-alert);">Vacant Input</em>'}
                                </td>
                                <td>${coreDetailsDisplay}</td>
                                <td style="text-align: right;">
                                    <button class="action-btn" onclick="openEditModal('${slot.id}')">Edit / Swap</button>
                                </td>
                            </tr>
                        `;
                    });

                    singleDateHtmlBlock += `</tbody></table></div>`;
                }

                singleDateHtmlBlock += `</div>`;
                contentArea.innerHTML += singleDateHtmlBlock;
            });
        }

        function openEditModal(id) {
            // FIXED: Using String() wrapper ensures database integer IDs don't fail strict equality checks
            const slot = globalRotaData.find(item => String(item.id) === String(id));
            if (!slot) return;

            document.getElementById('edit-slot-id').value = slot.id;
            document.getElementById('edit-names').value = slot.assigned_persons || '';
            document.getElementById('edit-cover-checkbox').checked = slot.needs_cover || false;
            document.getElementById('edit-story').value = slot.story || '';
            document.getElementById('edit-verse').value = slot.memory_verse || '';
            document.getElementById('edit-notes').value = slot.focus_context || slot.notes || slot.details || '';

            document.getElementById('modal-title').innerText = `Edit: ${slot.rota_name}`;
            document.getElementById('modal-role-label').innerText = `Assigning to [ ${slot.role} ] :`;

            const isSundaySchool = slot.rota_name.toLowerCase().includes("sunday school") || slot.rota_name.toLowerCase().includes("sunday kids");
            document.getElementById('modal-story-group').style.display = isSundaySchool ? 'block' : 'none';
            document.getElementById('modal-verse-group').style.display = isSundaySchool ? 'block' : 'none';

            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        async function saveSlotChanges() {
            const id = document.getElementById('edit-slot-id').value;
            const updatedNames = document.getElementById('edit-names').value;
            const updatedCover = document.getElementById('edit-cover-checkbox').checked;
            const updatedStory = document.getElementById('edit-story').value;
            const updatedVerse = document.getElementById('edit-verse').value;
            const updatedNotes = document.getElementById('edit-notes').value;

            if (!updatedNames.trim()) {
                alert("Please enter assignment names or state 'Vacant Input'.");
                return;
            }

            // Target the button to show loading state
            const saveBtn = document.querySelector('.save-btn');
            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            const { error } = await db
                .from('rotas')
                .update({ 
                    assigned_persons: updatedNames.trim(),
                    needs_cover: updatedCover,
                    story: updatedStory.trim(),
                    memory_verse: updatedVerse.trim(),
                    focus_context: updatedNotes.trim(),
                    notes: updatedNotes.trim(),
                    details: updatedNotes.trim()
                })
                .eq('id', id);

            if (error) {
                alert("Failed to modify slot assignment details: " + error.message);
                saveBtn.innerText = "Save Changes";
                saveBtn.disabled = false;
            } else {
                closeModal();
                saveBtn.innerText = "Save Changes";
                saveBtn.disabled = false;
                
                await fetchUpcomingRotas();
                
                if(document.getElementById('personal-name-input').value.trim()) {
                    findPersonalSchedule();
                }
            }
        }
    </script>
</body>
</html>
