<!DOCTYPE html>
<html lang="en">
<body>
    <div id="debug">Testing connection...</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = supabase.createClient(
            "https://ojzwujpahfjmaeisnfez.supabase.co", 
            "YOUR_NEWLY_GENERATED_ANON_KEY"
        );

        async function runDiagnostic() {
            const display = document.getElementById('debug');
            try {
                // 1. Check if we can reach the table at all
                const { data, error } = await supabase.from('rota_slots').select('*');
                if (error) {
                    display.innerText = "CONNECTION ERROR: " + error.message;
                } else {
                    display.innerText = "CONNECTION SUCCESS: Table reached. Found " + data.length + " rows.";
                }
            } catch (err) {
                display.innerText = "CRITICAL FAILURE: " + err.message;
            }
        }
        runDiagnostic();
    </script>
</body>
</html>
