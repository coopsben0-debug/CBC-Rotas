<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craigavon Baptist Church — Multi-Rota Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .view-content { display: none; }
        .view-content.active { display: block; }
        .filter-chip.active { background-color: #1e293b; color: #ffffff; border-color: #1e293b; }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">
    <div id="app-screen" class="min-h-screen flex flex-col md:flex-row">
        <aside class="w-64 bg-slate-900 p-4 shrink-0">
            <h1 class="text-white font-black text-sm mb-8">Craigavon Baptist</h1>
            <nav class="space-y-2">
                <button onclick="changeSidebarRoute('master')" class="w-full text-left text-white bg-slate-800 p-3 rounded-xl font-bold text-xs">📊 Master Grid</button>
            </nav>
        </aside>
        <main class="flex-1 p-8">
            <div id="view-master" class="view-content active space-y-6">
                <h2 class="text-2xl font-black">Master Ministry Schedules</h2>
                <div class="flex flex-wrap gap-2" id="filter-bar">
                    <button onclick="filterDepartment('all')" class="filter-chip active p-2 border rounded-lg text-xs font-bold bg-white">Show All</button>
                </div>
                <div id="master-cards-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://ojzwujpahfjmaeisnfez.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qend1anBhaGZqbWFlaXNuZmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTA5NDMsImV4cCI6MjA5NDU4Njk0M30.VvszGR6MbUnBhKsmsXBikkrjok2-F1bnyS4zOwDX5hg";       
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const CATEGORIES_TEMPLATE = [
            { key: 'Welcome', label: 'Welcome & Building' },
            { key: 'Worship', label: 'Worship Team' },
            { key: 'Sound Desk', label: 'Sound & Computer' },
            { key: 'Tea and Coffee', label: 'Tea & Coffee Rota' },
            { key: 'Hall Duty', label: 'Sports Hall Duty' },
            { key: 'Jr Sunday School', label: 'Junior Sunday School' },
            { key: 'Sr Sunday School', label: 'CB Sunday Kids' },
            { key: 'Cleaning', label: 'Cleaning Team' }
        ];

        async function renderMasterFeed(filter = 'all') {
            const feed = document.getElementById('master-cards-feed');
            feed.innerHTML = '<p class="text-sm">Loading schedules...</p>';

            // Querying the slots and joining with the dates table
            let query = supabaseClient
                .from('rota_slots')
                .select('role_title, member_name_text, service_dates(date)')
                .order('service_date_id');
            
            if (filter !== 'all') {
                query = query.eq('role_title', filter);
            }

            const { data, error } = await query;

            if (error) {
                feed.innerHTML = `<p class="text-red-500 text-sm">Error: ${error.message}</p>`;
                return;
            }

            // Rendering the data into cards
            feed.innerHTML = data.length > 0 
                ? data.map(item => `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-900 text-sm">${item.role_title}</h3>
                        <p class="text-[10px] text-slate-400 font-mono">${item.service_dates?.date || 'N/A'}</p>
                        <p class="text-sm mt-2 text-slate-700">${item.member_name_text}</p>
                    </div>
                `).join('')
                : '<p class="text-sm">No slots found.</p>';
        }

        function filterDepartment(deptKey) {
            document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            renderMasterFeed(deptKey);
        }

        function changeSidebarRoute(route) {}

        // Initialize Filter Bar
        const bar = document.getElementById('filter-bar');
        CATEGORIES_TEMPLATE.forEach(cat => {
            bar.innerHTML += `<button onclick="filterDepartment('${cat.key}')" class="filter-chip p-2 border rounded-lg text-xs font-bold bg-white">${cat.label}</button>`;
        });

        // Load data on page launch
        renderMasterFeed();
    </script>
</body>
</html>
