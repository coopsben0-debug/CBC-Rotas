<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Craigavon Baptist Church — Multi-Rota Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg-main: #f8fafc;
      --sidebar-bg: #0f172a;
      --sidebar-hover: #1e293b;
      --card-bg: #ffffff;
      --cbc-navy: #0f172a;
      --cbc-blue: #0284c7;
      --border-color: #e2e8f0;
      --text-main: #334155;
      --text-muted: #64748b;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; }

    #loading-screen { position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    .spinner { border: 3px solid var(--border-color); border-top: 3px solid var(--cbc-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #auth-screen { min-height: 100vh; width: 100vw; background: var(--sidebar-bg); display: flex; align-items: center; justify-content: center; }
    .auth-card { background: #fff; border-radius: var(--radius); padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .auth-btn { width: 100%; padding: 12px; background: var(--cbc-blue); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 12px; }

    #app { display: none; width: 100%; min-height: 100vh; }
    sidebar { width: 280px; background: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; padding: 24px; flex-shrink: 0; }
    .sidebar-brand { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; margin-bottom: 32px; color: #fff; border-bottom: 1px solid #1e293b; padding-bottom: 16px; }
    .sidebar-brand span { display: block; font-family: 'Inter', sans-serif; font-size: 12px; color: var(--cbc-blue); }
    
    .nav-group { display: flex; flex-direction: column; gap: 6px; }
    .sidebar-nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; background: transparent; border: none; border-radius: 8px; color: #94a3b8; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; }
    .sidebar-nav-btn.active, .sidebar-nav-btn:hover { background: var(--sidebar-hover); color: #fff; }

    .viewport { flex: 1; padding: 40px; max-width: 1400px; margin: 0 auto; width: 100%; overflow-y: auto; }
    .page-header { margin-bottom: 32px; }
    .page-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: var(--cbc-navy); }
    
    .filter-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .filter-btn { padding: 8px 16px; border-radius: 20px; background: #fff; border: 1.5px solid var(--border-color); font-size: 13px; font-weight: 600; cursor: pointer; }
    .filter-btn.active { background: var(--cbc-blue); color: #fff; border-color: var(--cbc-blue); }

    .grid-three { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
    .card { background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
    .card-date { font-size: 18px; font-weight: 700; color: var(--cbc-navy); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--bg-main); }
    
    .card-assignment { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; border-left: 4px solid var(--cbc-blue); }
    .card-assignment.jr-ss { border-left-color: #ec4899; }
    .card-assignment.sr-ss { border-left-color: #a855f7; }
    .card-assignment.worship { border-left-color: #0ea5e9; }
    .card-assignment.communion { border-left-color: #10b981; }
    .card-assignment.greeting { border-left-color: #f59e0b; }
    .card-assignment.tea-coffee { border-left-color: #14b8a6; }
    .card-assignment.hall-duty { border-left-color: #6366f1; }
    .card-assignment.sound-desk { border-left-color: #64748b; }

    .role-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    .member-name { font-size: 15px; font-weight: 700; color: var(--cbc-navy); margin-top: 2px; }

    .admin-panel-box { background: #fff; border: 1px solid #bbf7d0; background: #f0fdf4; border-radius: var(--radius); padding: 24px; margin-bottom: 32px; }
    .admin-btn { padding: 12px 24px; background: #16a34a; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    .user-profile-box { border-top: 1px solid #1e293b; padding-top: 16px; margin-top: auto; font-size: 13px; color: #94a3b8; }
    .empty-msg { font-size: 14px; color: var(--text-muted); font-style: italic; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text" style="font-size: 14px; color: var(--text-muted);">Syncing Church Rotas...</div>
  </div>

  <div id="auth-screen" style="display:none;">
    <div class="auth-card">
      <div class="sidebar-brand">Craigavon Baptist Rota</div>
      <div class="field" style="margin-bottom:12px;"><label>Email</label><input type="email" id="login-email" style="width:100%; padding:10px; margin-top:4px;" value="coopsben0@gmail.com"/></div>
      <div class="field" style="margin-bottom:16px;"><label>Password</label><input type="password" id="login-password" style="width:100%; padding:10px; margin-top:4px;" placeholder="••••••••"/></div>
      <button class="auth-btn" onclick="handleAuthAction()">Log In</button>
    </div>
  </div>

  <div id="app">
    <sidebar>
      <div class="sidebar-brand">Craigavon Baptist<span>All-Ministry Terminal</span></div>
      <div class="nav-group">
        <button class="sidebar-nav-btn active">🗓️ Master Rota Grid</button>
      </div>
      <div class="user-profile-box">
        <div id="user-display-email">---</div>
        <button style="background:none; border:none; color:#ef4444; cursor:pointer; margin-top:8px; font-weight:600;" onclick="signOut()">Sign Out</button>
      </div>
    </sidebar>

    <div class="viewport">
      <div id="admin-panel" class="admin-panel-box" style="display:none;">
        <h3 style="color:#166534;">⚡ Master Church Initialization Engine</h3>
        <p style="font-size:13px; color:#166534; margin-top:4px;">This setup creates automated tracking rosters across all 8 custom structural request departments.</p>
        <button class="admin-btn" onclick="pushEightCustomRotas()">🚀 Deploy 8 Separate Ministry Schedules</button>
      </div>

      <div class="page-header">
        <h1 class="page-title">Craigavon Baptist Church Master Schedules</h1>
      </div>

      <div class="filter-container" id="category-filters"></div>
      <div id="master-grid" class="grid-three"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ojzwujpahfjmaeisnfez.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qend1anBhaGZqbWFlaXNuZmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTA5NDMsImV4cCI6MjA5NDU4Njk0M30.VvszGR6MbUnBhKsmsXBikkrjok2-F1bnyS4zOwDX5hg';
    
    // Explicit 8 separate ministry lists mapped out using your full congregation directory
    const MINISTRY_POOLS = {
      jr_sunday_school: ["Amelie", "Iris Argue", "Adam Cooper", "Dad", "Henry", "John"],
      sr_sunday_school: ["Kathryn Beggs", "Niall Keys", "Charlotte McCabe", "Mervyn Scott", "Mum", "Nathanael McCabe"],
      worship: ["Paul Savage", "Emma Savage", "Carole Mckenna", "Rosemary T", "Godiya Bwala", "andrewbwala", "Sarah Pogue"],
      communion: ["Janet McAuley", "Neil", "Andrew Ferguson", "Andrew Pogue", "Julie", "Elizabeth"],
      greeting: ["Stephen McAuley", "Robert", "Tbelle", "Adrian Tomlinson", "Glynis"],
      tea_coffee: ["Harry McCrum", "Lesley Quinn", "Paul", "Ann", "Margaret Jackson"],
      hall_duty: ["Ruth Hamilton", "Wes", "Karen Scott", "Janet"],
      sound_desk: ["Oluwatosin Ogunkayode St", "Philip Bain", "Michael Quinn", "Cyril Nelson"]
    };

    const MINISTRY_LABELS = {
      jr_sunday_school: { name: "Jr Sunday School", css: "jr-ss" },
      sr_sunday_school: { name: "Sr Sunday School", css: "sr-ss" },
      worship: { name: "Worship Team", css: "worship" },
      communion: { name: "Communion Prep", css: "communion" },
      greeting: { name: "Welcome Greeting", css: "greeting" },
      tea_coffee: { name: "Tea & Coffee Duty", css: "tea-coffee" },
      hall_duty: { name: "Hall Duty Guard", css: "hall-duty" },
      sound_desk: { name: "Sound & Desk Tech", css: "sound-desk" }
    };

    let sb, appState = { user: null, dates: [], slots: [], rotas: [] }, currentFilter = 'all';

    window.addEventListener('load', async () => {
      try {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const sessionCheck = await sb.auth.getSession();
        if (sessionCheck?.data?.session?.user) {
          appState.user = sessionCheck.data.session.user;
          await initDashboard();
        } else {
          document.getElementById('loading-screen').style.display = 'none';
          document.getElementById('auth-screen').style.display = 'flex';
        }
      } catch (err) {
        showGlobalError("Initialization failed: " + err.message);
      }
    });

    async function handleAuthAction() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) alert(error.message); else location.reload();
    }

    async function initDashboard() {
      document.getElementById('user-display-email').innerText = appState.user.email;
      if (appState.user.email === 'coopsben0@gmail.com') document.getElementById('admin-panel').style.display = 'block';

      const [dRes, sRes, rRes] = await Promise.all([
        sb.from('service_dates').select('*'),
        sb.from('rota_slots').select('*'),
        sb.from('rotas').select('*')
      ]);

      if (dRes.error) console.error("Dates error:", dRes.error);
      if (sRes.error) console.error("Slots error:", sRes.error);

      appState.dates = dRes.data || [];
      appState.slots = sRes.data || [];
      appState.rotas = rRes.data || [];
      appState.dates.sort((a,b) => new Date(a.date) - new Date(b.date));

      buildFilters();
      renderGrid();
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }

    async function pushEightCustomRotas() {
      if (!confirm("This will overwrite existing data and establish clean timelines for all 8 separate ministries. Proceed?")) return;
      
      document.getElementById('loading-text').innerText = "Clearing old rosters and deploying tables...";
      document.getElementById('loading-screen').style.display = 'flex';

      try {
        // Clear any old slots to clean the slate
        const { error: delError } = await sb.from('rota_slots').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        if (delError) throw delError;

        // Grab a fallback real valid UUID from your database tables
        const validFallbackRotaId = appState.rotas[0]?.id;
        if (!validFallbackRotaId) {
          throw new Error("No existing records found in your 'rotas' table. Please ensure at least one base rota exists in Supabase first.");
        }

        let payload = [];
        
        appState.dates.forEach((dateObj, dateIndex) => {
          Object.keys(MINISTRY_POOLS).forEach(key => {
            const pool = MINISTRY_POOLS[key];
            const server1 = pool[(dateIndex * 2) % pool.length];
            const server2 = pool[(dateIndex * 2 + 1) % pool.length];

            payload.push({
              rota_id: validFallbackRotaId, 
              service_date_id: dateObj.id,
              role_title: key, 
              member_name_text: `${server1} & ${server2}`,
              status: 'normal'
            });
          });
        });

        const { error: insError } = await sb.from('rota_slots').insert(payload);
        if (insError) throw insError;

        alert("Successfully generated and deployed all 8 clean ministry lists!");
        location.reload();

      } catch (err) {
        document.getElementById('loading-screen').style.display = 'none';
        alert("Deployment Error: " + err.message);
      }
    }

    function buildFilters() {
      const fBox = document.getElementById('category-filters');
      let html = `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="applyFilter('all')">Show Everything</button>`;
      Object.keys(MINISTRY_POOLS).forEach(k => {
        html += `<button class="filter-btn ${currentFilter === k ? 'active' : ''}" onclick="applyFilter('${k}')">${MINISTRY_LABELS[k].name}</button>`;
      });
      fBox.innerHTML = html;
    }

    function applyFilter(k) {
      currentFilter = k;
      buildFilters();
      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById('master-grid');
      let html = '';

      appState.dates.forEach(d => {
        let slots = appState.slots.filter(s => s.service_date_id === d.id);
        if (currentFilter !== 'all') slots = slots.filter(s => s.role_title === currentFilter);

        if (slots.length) {
          html += `
            <div class="card">
              <div class="card-date">☀️ ${new Date(d.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
          `;
          slots.forEach(s => {
            const config = MINISTRY_LABELS[s.role_title] || { name: s.role_title, css: 'default' };
            html += `
              <div class="card-assignment ${config.css}">
                <div class="role-title">${config.name}</div>
                <div class="member-name">${s.member_name_text || 'Unassigned Slot'}</div>
              </div>
            `;
          });
          html += `</div>`;
        }
      });
      container.innerHTML = html || `<div class="empty-msg">No team entries matching selection found.</div>`;
    }

    function showGlobalError(msg) {
      document.getElementById('loading-screen').style.display = 'flex';
      document.getElementById('loading-text').innerHTML = `<b style="color:#ef4444;">System Error:</b><br>${msg}`;
    }

    function signOut() { sb.auth.signOut().then(() => location.reload()); }
  </script>
</body>
</html>
