<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Rota</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #58a6ff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #30363d; }
        th { color: var(--accent); }
    </style>
</head>
<body>
    <main class="container">
        <h1>Upcoming Sundays</h1>
        <table>
            <thead><tr><th>Date</th><th>Team Members</th></tr></thead>
            <tbody id="rota-body"></tbody>
        </table>
    </main>

    <script>
        const rota = [
            { date: "2026-06-14", team: "Tosin, Niall" },
            { date: "2026-06-21", team: "John, Ruth" },
            { date: "2026-06-28", team: "Andrew P" },
            { date: "2026-07-05", team: "Leanne, Colin" },
            { date: "2026-07-12", team: "Niall, Tosin" },
            { date: "2026-07-19", team: "Philip" },
            { date: "2026-07-26", team: "Colin, Henry" }
        ];

        const today = new Date().setHours(0,0,0,0);
        const body = document.getElementById('rota-body');

        // 1. Sort, 2. Filter, 3. Render
        rota.sort((a, b) => new Date(a.date) - new Date(b.date))
            .filter(item => new Date(item.date).getTime() >= today)
            .forEach(item => {
                body.innerHTML += `<tr><td>${item.date}</td><td>${item.team}</td></tr>`;
            });
    </script>
</body>
</html>
