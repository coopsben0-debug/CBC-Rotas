<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBC Rotas - Login</title>
  <style>
    :root {
      --bg-dark: #0f2b48;
      --card-bg: #ffffff;
      --primary: #0f2b48;
      --primary-hover: #1a365d;
      --accent: #38b2ac;
      --text-main: #2d3748;
      --text-muted: #718096;
      --light-blue: #ebf8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo-container {
      width: 70px;
      height: 70px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem auto;
    }

    .logo-container svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 0.25rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #4a5568;
      margin-bottom: 0.4rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
      background-color: var(--light-blue);
      color: #2d3748;
    }

    input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .error-box {
      display: none;
      margin-top: 1.25rem;
      padding: 0.75rem;
      background-color: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 6px;
      color: #c53030;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L4 7v13h16V7l-8-5zm6 16H6V8.5l6-3.75 6 3.75V18z"/>
      </svg>
    </div>
    <h1>CBC Rotas</h1>
    <p class="subtitle">Craigavon Baptist Church Rota Management</p>

    <form id="login-form" onsubmit="handleLogin(event); return false;">
      <div class="form-group">
        <label for="user-name">Your Name</label>
        <input type="text" id="user-name" autocomplete="off" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="passcode">Passcode</label>
        <input type="password" id="passcode" autocomplete="current-password" placeholder="Enter secret passcode" required>
      </div>

      <button type="submit" class="btn">Access Rotas</button>
      <div id="error-message" class="error-box"></div>
    </form>
  </div>

  <script>
    const SECRET_PASSCODE = "1234";

    // Auto-redirect if already logged in
    if (localStorage.getItem('cbc_user_name')) {
      window.location.href = "rotas.html";
    }

    function handleLogin(event) {
      event.preventDefault();
      const userName = document.getElementById('user-name').value.trim();
      const enteredPasscode = document.getElementById('passcode').value.trim();
      const errorBox = document.getElementById('error-message');

      if (!userName) {
        errorBox.innerText = "Please enter your name.";
        errorBox.style.display = "block";
        return;
      }

      if (enteredPasscode !== SECRET_PASSCODE) {
        errorBox.innerText = "Incorrect passcode. Please try again.";
        errorBox.style.display = "block";
        return;
      }

      // Save user session and navigate to dashboard page
      localStorage.setItem('cbc_user_name', userName);
      window.location.href = "rotas.html";
    }
  </script>
</body>
</html>
