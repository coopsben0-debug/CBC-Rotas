<!DOCTYPE html>
<html lang="en">
<body>
    <div id="display" style="font-size: 24px; padding: 50px;">Attempting to connect...</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const display = document.getElementById('display');
        const SUPABASE_URL = "https://ojzwujpahfjmaeisnfez.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qend1anBhaGZqbWFlaXNuZmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTA5NDMsImV4cCI6MjA5NDU4Njk0M30.VvszGR6MbUnBhKsmsXBikkrjok2-F1bnyS4zOwDX5hg";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fetch data
        supabase.from('rota_slots').select('*')
            .then(response => {
                if (response.error) {
                    display.style.color = "red";
                    display.innerText = "ERROR: " + response.error.message;
                    console.error(response.error);
                } else {
                    display.innerText = "SUCCESS! Found " + response.data.length + " slots.";
                    console.log(response.data);
                }
            })
            .catch(err => {
                display.style.color = "red";
                display.innerText = "FATAL ERROR: " + err.message;
            });
    </script>
