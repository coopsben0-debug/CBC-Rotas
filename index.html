<script>
        // ==========================================
        // 1. SUPABASE CONNECTION CONFIGURATION
        // ==========================================
        const SUPABASE_URL = "https://your-supabase-project.supabase.co"; // Replace with your real Supabase Project URL
        const SUPABASE_ANON_KEY = "your-anon-public-api-key-here";       // Replace with your real Project Anon API Key
        
        let supabaseClient = null;
        if (SUPABASE_URL !== "https://your-supabase-project.supabase.co") {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const SEED_KEYS = { member: 'craigavonbaptist2026', admin: 'cbcadmin2026!' };

        // State now uses empty arrays that populate dynamically from your live database tables
        let appState = {
            user: null,
            role: 'member',
            activeTargetFilter: 'all',
            liveEditingEnabled: false,
            activeTradingContext: null,
            schedules: [] 
        };

        let isSignUpMode = true;

        // ==========================================
        // 2. LIVE DATABASE DATABASE HOOKS (GET/PATCH)
        // ==========================================
        async function fetchLiveSchedules() {
            if (!supabaseClient) {
                console.log("Supabase not fully configured yet. Operating in local-offline mock mode.");
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('schedules')
                    .select('*');
                
                if (error) throw error;
                
                if (data && data.length > 0) {
                    // Sort rows by ID or Date string if necessary to keep order clean
                    appState.schedules = data.sort((a, b) => a.id.localeCompare(b.id));
                    
                    // Trigger UI re-renders with fresh database rows
                    renderMasterFeed();
                    renderPersonalFeed();
                    renderSwapsForum();
                }
            } catch (err) {
                console.error("Database connection failure:", err.message);
            }
        }

        async function pushLiveScheduleRowUpdate(rowId, targetRow) {
            if (!supabaseClient) return true; // Fail silently if offline mode
            try {
                const { error } = await supabaseClient
                    .from('schedules')
                    .update({
                        worship: targetRow.worship,
                        kids: targetRow.kids,
                        tea: targetRow.tea,
                        sound: targetRow.sound,
                        hall: targetRow.hall,
                        pool: targetRow.pool
                    })
                    .eq('id', rowId);

                if (error) throw error;
                return true;
            } catch (err) {
                alert("Database Update Error: " + err.message);
                return false;
            }
        }

        // ==========================================
        // 3. AUTHENTICATION & LOGIN WORKFLOW
        // ==========================================
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const submitBtn = document.getElementById('auth-submit-btn');
            const toggleBtn = document.getElementById('toggle-auth-mode-btn');
            const wrapper = document.getElementById('access-code-wrapper');

            if (isSignUpMode) {
                title.innerText = "Church Rota Portal";
                subtitle.innerText = "Create an account to manage your upcoming team assignments";
                submitBtn.innerText = "Register Account";
                toggleBtn.innerText = "Already have an account? Log In instead";
                wrapper.classList.remove('hidden');
                document.getElementById('auth-access-code').required = true;
            } else {
                title.innerText = "Welcome Back";
                subtitle.innerText = "Sign in to access your custom scheduling options";
                submitBtn.innerText = "Log Into Portal";
                toggleBtn.innerText = "Need an account? Sign Up instead";
                wrapper.classList.add('hidden');
                document.getElementById('auth-access-code').required = false;
            }
        }

        document.getElementById('registration-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const errorDiv = document.getElementById('auth-error');
            errorDiv.classList.add('hidden');

            if (isSignUpMode) {
                let typedCode = document.getElementById('auth-access-code').value.trim().toLowerCase();
                
                if (['craigavinbpatist2026', 'craigavonbpatist2026', 'craigavinbaptist2026', 'craivabonbaptist2026'].includes(typedCode)) {
                    typedCode = 'craigavonbaptist2026';
                }

                let roleAssigned = null;
                if (typedCode === SEED_KEYS.member) roleAssigned = 'member';
                else if (typedCode === SEED_KEYS.admin) roleAssigned = 'admin';
                else {
                    errorDiv.innerText = 'Error: Valid Church Verification Access Code required.';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                if (supabaseClient) {
                    try {
                        const { data, error } = await supabaseClient.auth.signUp({
                            email, password, options: { data: { role: roleAssigned } }
                        });
                        if (error) throw error;
                        await executeEntrySequence(email, roleAssigned);
                    } catch (err) {
                        errorDiv.innerText = `Database Fault: ${err.message}`;
                        errorDiv.classList.remove('hidden');
                    }
                } else {
                    await executeEntrySequence(email, roleAssigned);
                }
            } else {
                if (supabaseClient) {
                    try {
                        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        await executeEntrySequence(email, data.user.user_metadata?.role || 'member');
                    } catch (err) {
                        errorDiv.innerText = `Sign In Fault: ${err.message}`;
                        errorDiv.classList.remove('hidden');
                    }
                } else {
                    await executeEntrySequence(email, email.includes('admin') ? 'admin' : 'member');
                }
            }
        });

        async function executeEntrySequence(email, role) {
            appState.user = email;
            appState.role = role;
            
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('sidebar-user-label').innerText = email;

            if (role === 'admin') {
                document.getElementById('admin-badge').classList.remove('hidden');
                document.getElementById('admin-tools-panel').classList.remove('hidden');
            }

            // Sync database entries right as user gets access
            await fetchLiveSchedules();
        }

        function handleUserLogOut() {
            appState.user = null;
            appState.role = 'member';
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('admin-badge').classList.add('hidden');
            document.getElementById('admin-tools-panel').classList.add('hidden');
        }

        // ==========================================
        // 4. NAVIGATION & FILTERS
        // ==========================================
        function changeSidebarRoute(targetViewId) {
            document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${targetViewId}`).classList.add('active');

            ['master', 'personal', 'swaps'].forEach(v => {
                const button = document.getElementById(`nav-${v}`);
                if (v === targetViewId) {
                    button.classList.add('bg-slate-800', 'text-white');
                    button.classList.remove('text-slate-400');
                } else {
                    button.classList.remove('bg-slate-800', 'text-white');
                    button.classList.add('text-slate-400');
                }
            });
        }

        function filterDepartment(deptKey) {
            appState.activeTargetFilter = deptKey;
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.classList.remove('active');
                if(chip.getAttribute('onclick').includes(`'${deptKey}'`)) {
                    chip.classList.add('active');
                }
            });
            renderMasterFeed();
        }

        function toggleLiveEditingState() {
            appState.liveEditingEnabled = !appState.liveEditingEnabled;
            const btn = document.getElementById('live-edit-btn');
            if(appState.liveEditingEnabled) {
                btn.innerHTML = "🔓 Live Editing Active";
                btn.classList.remove('bg-slate-100', 'text-slate-700');
                btn.classList.add('bg-amber-600', 'text-white', 'border-amber-700');
            } else {
                btn.innerHTML = "🔒 Enable Live Editing";
                btn.classList.add('bg-slate-100', 'text-slate-700');
                btn.classList.remove('bg-amber-600', 'text-white', 'border-amber-700');
            }
            renderMasterFeed();
        }

        async function triggerRegenerateSchedules() {
            await fetchLiveSchedules();
            alert("Schedules re-synchronized with live database tables successfully.");
        }

        // ==========================================
        // 5. INTERFACE RENDERING LOGIC
        // ==========================================
        function renderMasterFeed() {
            const feed = document.getElementById('master-cards-feed');
            feed.innerHTML = '';

            if (appState.schedules.length === 0) {
                feed.innerHTML = `<div class="col-span-full py-8 text-center text-slate-400 font-semibold">Loading shift rows from database...</div>`;
                return;
            }

            appState.schedules.forEach(item => {
                const categories = [
                    { key: 'worship', label: 'Music Team', icon: '🎵' },
                    { key: 'kids', label: 'CB Sunday Kids', icon: '👶' },
                    { key: 'tea', label: 'Tea Rota', icon: '☕' },
                    { key: 'sound', label: 'Sound Desk and Computer', icon: '🎛️' },
                    { key: 'hall', label: 'Sports Hall Rota', icon: '🏀' }
                ];

                let matchesFilter = appState.activeTargetFilter === 'all' || categories.some(c => c.key === appState.activeTargetFilter);
                if (!matchesFilter) return;

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-gray-200 shadow-xs overflow-hidden flex flex-col";
                
                let headerHtml = `
                    <div class="bg-slate-50 px-4 py-3 border-b border-gray-100 flex justify-between items-center">
                        <span class="text-xs font-black text-slate-700 tracking-wide">${item.date}</span>
                        <span class="text-[10px] bg-slate-200/70 text-slate-600 font-bold px-2 py-0.5 rounded-md">Sunday Service</span>
                    </div>
                    <div class="p-4 space-y-4 flex-1">
                `;

                let internalBlocksHtml = '';

                categories.forEach(cat => {
                    if (appState.activeTargetFilter !== 'all' && appState.activeTargetFilter !== cat.key) return;

                    const currentAssignee = item[cat.key];
                    const isVacantPool = item.pool && item.pool.includes(cat.key);
                    
                    let interactionMarkup = '';
                    if (isVacantPool) {
                        interactionMarkup = `
                            <div class="mt-2 bg-red-50 border border-red-100 p-2 rounded-xl flex justify-between items-center text-xs font-bold text-red-700">
                                <span>🚨 OPEN POOL VACANCY</span>
                                <button class="bg-red-600 text-white text-[10px] px-2.5 py-1 rounded-lg cursor-pointer hover:bg-red-700 transition-all" onclick="claimOpenPoolSlot('${item.id}', '${cat.key}')">Claim</button>
                            </div>`;
                    } else if (appState.liveEditingEnabled) {
                        interactionMarkup = `
                            <button class="mt-1.5 w-full text-left bg-slate-50 hover:bg-teal-50 border border-slate-200 hover:border-teal-300 text-slate-500 hover:text-teal-700 text-[11px] font-bold py-1 px-2 rounded-lg transition-all flex items-center justify-between" onclick="openTradingModal('${item.id}', '${cat.key}', '${currentAssignee.replace(/'/g, "\\'")}')">
                                <span>🔄 Request Trade / Swap</span>
                                <span>→</span>
                            </button>`;
                    }

                    internalBlocksHtml += `
                        <div class="border-l-3 border-teal-500 pl-3 py-0.5">
                            <div class="flex items-center gap-1.5">
                                <span class="text-xs">${cat.icon}</span>
                                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">${cat.label}</span>
                            </div>
                            <p class="text-xs sm:text-sm font-semibold text-slate-800 mt-0.5 leading-tight">${currentAssignee}</p>
                            ${interactionMarkup}
                        </div>
                    `;
                });

                card.innerHTML = headerHtml + internalBlocksHtml + '</div>';
                feed.appendChild(card);
            });
        }

        function renderPersonalFeed() {
            const feed = document.getElementById('personal-cards-feed');
            feed.innerHTML = '';

            if (!appState.user) return;
            const keyword = appState.user.split('@')[0].toLowerCase();

            const categories = [
                { key: 'worship', label: 'Music Team', icon: '🎵' },
                { key: 'kids', label: 'CB Sunday Kids', icon: '👶' },
                { key: 'tea', label: 'Tea Rota', icon: '☕' },
                { key: 'sound', label: 'Sound Desk', icon: '🎛️' },
                { key: 'hall', label: 'Sports Hall Rota', icon: '🏀' }
            ];

            let count = 0;

            appState.schedules.forEach(item => {
                categories.forEach(cat => {
                    const assignedText = item[cat.key];
                    const isVacant = item.pool && item.pool.includes(cat.key);
                    if (assignedText.toLowerCase().includes(keyword) && !isVacant) {
                        count++;
                        const card = document.createElement('div');
                        card.className = "bg-white border-2 border-teal-500/20 rounded-2xl p-5 shadow-xs flex flex-col gap-3 relative overflow-hidden";
                        card.innerHTML = `
                            <div class="absolute top-0 right-0 bg-teal-500 text-white text-[9px] font-black uppercase tracking-wider px-2.5 py-1 rounded-bl-xl">Confirmed</div>
                            <div class="text-xs font-black text-slate-400 uppercase tracking-widest">${item.date}</div>
                            <div class="flex items-center gap-2">
                                <span class="text-xl">${cat.icon}</span>
                                <div>
                                    <h4 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider leading-none">${cat.label}</h4>
                                    <p class="text-sm font-black text-slate-800 mt-1">${assignedText}</p>
                                </div>
                            </div>
                            <button class="mt-2 w-full text-center bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs py-2 rounded-xl border border-slate-200 transition-all cursor-pointer" onclick="initiatePersonalSwap('${item.id}', '${cat.key}', '${assignedText.replace(/'/g, "\\'")}')">
                                🔄 Offer Out to Swap Forum
                            </button>
                        `;
                        feed.appendChild(card);
                    }
                });
            });

            if (count === 0) {
                feed.innerHTML = `
                    <div class="col-span-full bg-slate-50 border border-dashed border-slate-200 p-8 rounded-2xl text-center text-sm font-medium text-slate-400">
                        No upcoming explicit shifts detected matching profile string "${keyword}".
                    </div>`;
            }
        }

        function renderSwapsForum() {
            const grid = document.getElementById('pool-forum-grid');
            grid.innerHTML = '';

            const catLabels = { worship: 'Music Team', kids: 'CB Sunday Kids', tea: 'Tea Rota', sound: 'Sound Desk', hall: 'Sports Hall Rota' };
            const catIcons = { worship: '🎵', kids: '👶', tea: '☕', sound: '🎛️', hall: '🏀' };
            
            let poolCount = 0;

            appState.schedules.forEach(item => {
                if (!item.pool) return;
                item.pool.forEach(catKey => {
                    poolCount++;
                    const card = document.createElement('div');
                    card.className = "bg-red-50/60 border border-red-200/80 p-4 rounded-2xl shadow-xs flex flex-col justify-between gap-3";
                    card.innerHTML = `
                        <div class="space-y-1">
                            <span class="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 bg-red-100 text-red-700 rounded-md inline-block">Unstaffed Duty Slot</span>
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-1">${item.date}</h4>
                            <div class="flex items-center gap-2 mt-2">
                                <span class="text-lg">${catIcons[catKey]}</span>
                                <span class="text-sm font-extrabold text-slate-800">${catLabels[catKey]}</span>
                            </div>
                        </div>
                        <button class="w-full text-center bg-red-600 hover:bg-red-700 text-white font-bold text-xs py-2 rounded-xl shadow-xs active:scale-98 transition-all cursor-pointer" onclick="claimOpenPoolSlot('${item.id}', '${catKey}')">
                            🙋 Claim Shift Coverage
                        </button>
                    `;
                    grid.appendChild(card);
                });
            });

            if (poolCount === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-slate-50 border border-dashed border-slate-200 p-6 rounded-2xl text-center text-xs font-semibold text-slate-400">
                        Excellent coverage! There are currently no open structural system drop vacancies.
                    </div>`;
            }
        }

        // ==========================================
        // 6. SWAPPING & COVERAGE LOGIC
        // ==========================================
        function initiatePersonalSwap(rowId, catKey, currentAssignee) {
            changeSidebarRoute('master');
            if(!appState.liveEditingEnabled) {
                toggleLiveEditingState();
            }
            openTradingModal(rowId, catKey, currentAssignee);
        }

        function openTradingModal(rowId, catKey, currentAssignee) {
            appState.activeTradingContext = { rowId, catKey };
            
            const modal = document.getElementById('swap-action-modal');
            const targetSelect = document.getElementById('modal-peer-target-select');
            
            document.getElementById('modal-origin-summary').innerText = `[${appState.schedules.find(s => s.id === rowId).date}] — Mode: ${catKey.toUpperCase()}`;
            document.getElementById('modal-identity-field').value = currentAssignee;
            
            targetSelect.innerHTML = '';
            appState.schedules.forEach(s => {
                if(s.id !== rowId && s[catKey] !== "Leave Blank / Unassigned") {
                    const option = document.createElement('option');
                    option.value = `${s.id}|${catKey}`;
                    option.innerText = `${s.date} — Current Holder: ${s[catKey]}`;
                    targetSelect.appendChild(option);
                }
            });

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            toggleModalFields();
        }

        function toggleModalFields() {
            const strategy = document.querySelector('input[name="modal-strategy"]:checked').value;
            const peerWrapper = document.getElementById('modal-peer-select-wrapper');
            
            if(strategy === 'direct') {
                peerWrapper.classList.remove('hidden');
            } else {
                peerWrapper.classList.add('hidden');
            }
        }

        function closeTradingModal() {
            const modal = document.getElementById('swap-action-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            appState.activeTradingContext = null;
        }

        async function commitModalSwapRequest() {
            if(!appState.activeTradingContext) return;
            const { rowId, catKey } = appState.activeTradingContext;
            const strategy = document.querySelector('input[name="modal-strategy"]:checked').value;

            const targetRow = appState.schedules.find(s => s.id === rowId);
            let updateSuccess = false;

            if(strategy === 'pool') {
                if(!targetRow.pool) targetRow.pool = [];
                if(!targetRow.pool.includes(catKey)) {
                    targetRow.pool.push(catKey);
                }
                updateSuccess = await pushLiveScheduleRowUpdate(rowId, targetRow);
                if (updateSuccess) alert("Shift dropped successfully to public pool.");
            } else {
                const selectVal = document.getElementById('modal-peer-target-select').value;
                if(!selectVal) {
                    alert("No valid swap target items available.");
                    closeTradingModal();
                    return;
                }
                const [peerRowId, peerCatKey] = selectVal.split('|');
                const peerRow = appState.schedules.find(s => s.id === peerRowId);
                
                // Swap strings 
                const temp = targetRow[catKey];
                targetRow[catKey] = peerRow[peerCatKey];
                peerRow[peerCatKey] = temp;
                
                // Update both affected rows in Supabase
                const success1 = await pushLiveScheduleRowUpdate(rowId, targetRow);
                const success2 = await pushLiveScheduleRowUpdate(peerRowId, peerRow);
                
                updateSuccess = success1 && success2;
                if (updateSuccess) alert("Direct peer swap saved securely!");
            }

            closeTradingModal();
            renderMasterFeed();
            renderPersonalFeed();
            renderSwapsForum();
        }

        async function claimOpenPoolSlot(rowId, catKey) {
            if(!appState.user) {
                alert("Please log in first to claim open pool vacancies.");
                return;
            }
            const nameSignature = appState.user.split('@')[0];
            const properName = nameSignature.charAt(0).toUpperCase() + nameSignature.slice(1);
            
            const targetRow = appState.schedules.find(s => s.id === rowId);
            if(targetRow) {
                targetRow[catKey] = properName;
                if (targetRow.pool) {
                    targetRow.pool = targetRow.pool.filter(k => k !== catKey);
                }
                
                const success = await pushLiveScheduleRowUpdate(rowId, targetRow);
                if (success) {
                    alert(`Coverage verified! Added ${properName} to the shift.`);
                    renderMasterFeed();
                    renderPersonalFeed();
                    renderSwapsForum();
                }
            }
        }
    </script>
