<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="debug">Loading...</div>
    <script>
        const supabase = supabase.createClient("https://ojzwujpahfjmaeisnfez.supabase.co", "YOUR_ANON_KEY_HERE");
        
        async function test() {
            const { data, error } = await supabase.from('rota_slots').select('role_title, service_dates(date)');
            if (error) { document.getElementById('debug').innerText = "ERROR: " + error.message; }
            else { document.getElementById('debug').innerText = "DATA FOUND: " + JSON.stringify(data); }
        }
        test();
    </script>
</body>
</html>
