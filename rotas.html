<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBC Rotas - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-[#0f2b48] text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <img src="cbc logo.webp" alt="CBC Logo" class="h-9 w-9 rounded-full object-contain bg-white p-0.5" onerror="this.onerror=null; this.src='https://via.placeholder.com/36?text=CBC';">
                <div>
                    <h1 class="text-lg font-bold tracking-tight leading-none">Craigavon Baptist Church</h1>
                    <span class="text-xs text-[#38b2ac] font-medium">Rota & Event Management</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2 bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-lg text-xs">
                    <span class="text-slate-400">User:</span>
                    <span id="currentUserLabel" class="font-bold text-[#38b2ac] capitalize">User</span>
                </div>

                <button onclick="logout()" class="bg-rose-900/40 hover:bg-rose-900/70 border border-rose-700/50 text-rose-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Tab Controls & Options -->
        <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center space-x-2 overflow-x-auto">
                <button onclick="switchTab('main')" id="tab-main" class="px-4 py-2 rounded-lg text-sm font-semibold bg-[#0f2b48] text-white transition">
                    Sunday Rotas View
                </button>
                <button onclick="switchTab('myschedule')" id="tab-myschedule" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
                    My Schedule
                </button>
                <button onclick="switchTab('events')" id="tab-events" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
                    Church Events
                </button>
            </div>

            <!-- Auto-Disappear Toggle -->
            <label class="flex items-center space-x-2 cursor-pointer bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg hover:bg-slate-100 transition select-none">
                <input type="checkbox" id="autoDisappearToggle" checked onchange="renderUI()" class="rounded text-[#38b2ac] focus:ring-[#38b2ac] h-4 w-4">
                <span class="text-xs font-bold text-slate-700 tracking-wide">HIDE PAST DATES</span>
            </label>
        </div>

        <!-- Personal Summary Banner -->
        <div id="personalUpcomingSection" class="bg-gradient-to-r from-[#0f2b48] to-[#1a365d] rounded-2xl p-5 text-white shadow-md">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                    <span class="text-xl">📋</span>
                    <h2 id="personalHeaderTitle" class="text-base font-bold tracking-tight capitalize">Your Upcoming Duties</h2>
                </div>
                <span id="personalDutyCount" class="bg-[#38b2ac]/20 text-[#38b2ac] text-xs px-2.5 py-1 rounded-full font-semibold border border-[#38b2ac]/40">0 upcoming</span>
            </div>
            <div id="personalDutiesList" class="flex flex-wrap gap-2.5"></div>
        </div>

        <!-- ROTA VIEW (Grouped by Sunday) -->
        <div id="view-rotas" class="space-y-6">
            <!-- Search & Filters -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                    <input type="text" id="searchInput" oninput="renderRotasBySunday()" placeholder="Search duty, member, or lesson..." class="w-full md:w-80 px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#38b2ac]">
                    <button onclick="loadDataFromTurso()" class="px-4 py-2 bg-[#0f2b48] text-white text-xs font-semibold rounded-lg hover:bg-[#1a365d] transition">
                        Refresh Data
                    </button>
                </div>
                <div id="categoryFilters" class="flex flex-wrap gap-1.5 pt-1"></div>
            </div>

            <!-- Sundays Container -->
            <div id="sundaysContainer" class="space-y-6"></div>
        </div>

        <!-- EVENTS VIEW -->
        <div id="view-events" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-[#0f2b48] mb-4">Upcoming Church Events</h3>
                <div id="eventsContainer" class="grid gap-4 md:grid-cols-2"></div>
            </div>
        </div>

    </main>

    <!-- Action Modal (Swap / Edit / Request Cover) -->
    <div id="actionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden border border-slate-200">
            <div class="bg-[#0f2b48] px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-base">Update Rota Duty</h3>
                <button onclick="closeActionModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editRotaId">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Date & Category</label>
                    <div id="modalDetailsLabel" class="text-sm font-semibold text-[#0f2b48]"></div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Assigned Member(s)</label>
                    <input type="text" id="editMembersInput" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-[#38b2ac]">
                </div>
                <label class="flex items-center space-x-2 p-2.5 bg-rose-50 border border-rose-200 rounded-lg cursor-pointer">
                    <input type="checkbox" id="editNeedsCoverCheck" class="rounded text-rose-600 h-4 w-4">
                    <span class="text-xs font-bold text-rose-700">🚨 Request Cover / Mark as Unavailable</span>
                </label>
                <div class="flex justify-end space-x-2 pt-2">
                    <button onclick="closeActionModal()" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg">Cancel</button>
                    <button onclick="saveRotaAction()" class="px-4 py-2 bg-[#0f2b48] text-white text-xs font-semibold rounded-lg hover:bg-[#1a365d]">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Daily Bible Verse Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto text-center space-y-2">
        <div class="max-w-xl mx-auto px-4">
            <p id="verseText" class="text-sm font-medium text-slate-700 italic">"Trust in the LORD with all your heart and lean not on your own understanding."</p>
            <p id="verseRef" class="text-xs font-bold text-[#38b2ac] mt-1">— Proverbs 3:5</p>
        </div>
        <div class="text-xs text-slate-400 pt-2 border-t border-slate-100">
            Craigavon Baptist Church • Rota Management Application
        </div>
    </footer>

    <script>
        const TURSO_URL = 'https://cbc-rota-coopsben0-debug.aws-eu-west-1.turso.io';
        const TURSO_TOKEN = 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3OTE2NzcyNjQsImlkIjoiMDFhMTI4MWQtYmMwMS03ZWNmLTlhZWMtMzRiNmI0YWQzOGY1Iiwia2lkIjoiRGl5ZFV0d0owWW9SM0p6RTlIeFE5aHZZWGtyZzlCRkRoajIzcG9pNjEtWSIsInJpZCI6IjBkNGZhNDQyLTdlOTEtNDg2NS1iZDM2LWMwYmVhZTNlMjhmZiJ9.OPYoqqbK6fTO6FXFgZPG0E-vooUxnj5rH6QYSeAOBGwHfT1zfy-EbiKoAte6ntLjgaAUZsemMJ8n6Kx3PQY_Ag';

        const ROTA_CATEGORIES = [
            'Tea Rota', 'Worship', 'Preaching', 'Senior Sunday School',
            'Junior Sunday School', 'Sound Desk', 'Opening', 'Welcome',
            'Table Prep', 'Handing Out Communion', 'Cleaners'
        ];

        let allRotas = [];
        let allEvents = [];
        let currentTab = 'main';
        let currentCategoryFilter = 'All';
        let currentUser = localStorage.getItem('cbc_user_name') || 'User';
        let userFirstName = currentUser.trim().split(' ')[0].toLowerCase();

        document.getElementById('currentUserLabel').textContent = currentUser;

        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryFilters();
            loadDataFromTurso();
            loadDailyVerse();
        });

        async function runTursoQuery(sql, args = []) {
            try {
                const response = await fetch(`${TURSO_URL}/v2/pipeline`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${TURSO_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        requests: [
                            { 
                                type: 'execute', 
                                stmt: { 
                                    sql: sql,
                                    args: args.map(v => ({ type: typeof v === 'number' ? 'integer' : 'text', value: String(v) }))
                                } 
                            },
                            { type: 'close' }
                        ]
                    })
                });

                const data = await response.json();
                if (!data.results || !data.results[0] || data.results[0].type === 'error') return [];

                const resObj = data.results[0].response.result;
                if (!resObj || !resObj.cols || !resObj.rows) return [];

                const cols = resObj.cols.map(c => c.name);
                return resObj.rows.map(row => {
                    let obj = {};
                    row.forEach((cell, idx) => { obj[cols[idx]] = cell ? cell.value : null; });
                    return obj;
                });
            } catch (err) {
                console.error('Turso Error:', err);
                return [];
            }
        }

        async function loadDataFromTurso() {
            try {
                const rotasData = await runTursoQuery("SELECT * FROM rotas ORDER BY date ASC;");
                const eventsData = await runTursoQuery("SELECT * FROM events ORDER BY date ASC;");

                if (rotasData && rotasData.length > 0) {
                    allRotas = rotasData.map(r => ({
                        id: r.id,
                        date: r.date || '',
                        category: r.category || r.rota_name || 'General',
                        role: r.role || 'Member',
                        assigned_members: r.assigned_members || r.members || '',
                        passage: r.passage || '',
                        lesson_title: r.lesson_title || '',
                        memory_verse: r.memory_verse || '',
                        needs_cover: r.needs_cover || 0
                    }));
                }
                allEvents = eventsData || [];
                renderUI();
            } catch (err) {
                console.error('Error loading Turso data:', err);
            }
        }

        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilters');
            let html = `<button onclick="setCategoryFilter('All')" class="px-3 py-1 rounded-full text-xs font-semibold ${currentCategoryFilter === 'All' ? 'bg-[#38b2ac] text-white' : 'bg-slate-100 text-slate-600'}">All</button>`;
            ROTA_CATEGORIES.forEach(cat => {
                html += `<button onclick="setCategoryFilter('${cat}')" class="px-3 py-1 rounded-full text-xs font-semibold ${currentCategoryFilter === cat ? 'bg-[#38b2ac] text-white' : 'bg-slate-100 text-slate-600'}">${cat}</button>`;
            });
            container.innerHTML = html;
        }

        function setCategoryFilter(cat) {
            currentCategoryFilter = cat;
            renderCategoryFilters();
            renderUI();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['main', 'myschedule', 'events'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                btn.className = (t === tab) 
                    ? 'px-4 py-2 rounded-lg text-sm font-semibold bg-[#0f2b48] text-white transition' 
                    : 'px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition';
            });

            document.getElementById('view-rotas').classList.toggle('hidden', tab === 'events');
            document.getElementById('view-events').classList.toggle('hidden', tab !== 'events');

            if (tab === 'events') renderEvents();
            else renderUI();
        }

        function renderUI() {
            renderPersonalSchedule();
            if (currentTab === 'events') renderEvents();
            else renderRotasBySunday();
        }

        function matchesUser(assignedStr) {
            if (!assignedStr) return false;
            return assignedStr.toLowerCase().includes(userFirstName);
        }

        function renderPersonalSchedule() {
            const today = new Date().toISOString().split('T')[0];
            const myUpcoming = allRotas.filter(r => 
                r.date >= today && matchesUser(r.assigned_members)
            );

            document.getElementById('personalDutyCount').textContent = `${myUpcoming.length} upcoming`;
            const container = document.getElementById('personalDutiesList');

            if (myUpcoming.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-300 italic">No upcoming duties found for ${currentUser}.</p>`;
                return;
            }

            container.innerHTML = myUpcoming.map(r => `
                <div class="bg-white/10 border border-white/20 px-3 py-1.5 rounded-lg text-xs flex items-center space-x-2">
                    <span class="font-bold text-[#38b2ac]">${r.date}</span>
                    <span>—</span>
                    <span>${r.category} (${r.role})</span>
                </div>
            `).join('');
        }

        function renderRotasBySunday() {
            const container = document.getElementById('sundaysContainer');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const hidePast = document.getElementById('autoDisappearToggle').checked;
            const today = new Date().toISOString().split('T')[0];

            // 1. Filter rotas based on search, tabs, and past dates
            const filtered = allRotas.filter(r => {
                if (hidePast && r.date < today) return false;
                if (currentTab === 'myschedule' && !matchesUser(r.assigned_members)) return false;
                if (currentCategoryFilter !== 'All' && r.category !== currentCategoryFilter) return false;
                
                if (search) {
                    const matchMember = r.assigned_members.toLowerCase().includes(search);
                    const matchCategory = r.category.toLowerCase().includes(search);
                    const matchLesson = (r.lesson_title || '').toLowerCase().includes(search);
                    const matchPassage = (r.passage || '').toLowerCase().includes(search);
                    if (!matchMember && !matchCategory && !matchLesson && !matchPassage) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-400">No matching rotas found. Uncheck "HIDE PAST DATES" or clear search filters.</div>`;
                return;
            }

            // 2. Group by Date (Sunday)
            const groupedByDate = {};
            filtered.forEach(r => {
                if (!groupedByDate[r.date]) groupedByDate[r.date] = [];
                groupedByDate[r.date].push(r);
            });

            // 3. Build Clash Map for each date
            const clashMap = {};
            allRotas.forEach(r => {
                const members = r.assigned_members.split(/[&,|]/).map(m => m.trim().toLowerCase());
                members.forEach(m => {
                    if (!m) return;
                    if (!clashMap[r.date]) clashMap[r.date] = {};
                    if (!clashMap[r.date][m]) clashMap[r.date][m] = [];
                    clashMap[r.date][m].push(r.category);
                });
            });

            // 4. Render Sunday Cards in chronological order
            const sortedDates = Object.keys(groupedByDate).sort();

            container.innerHTML = sortedDates.map(date => {
                const duties = groupedByDate[date];
                
                // Format Date nicely (e.g., Sunday, 11 Oct 2026)
                const dateObj = new Date(date);
                const dateFormatted = !isNaN(dateObj) ? dateObj.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' }) : date;

                const dutyRows = duties.map(r => {
                    const members = r.assigned_members.split(/[&,|]/).map(m => m.trim().toLowerCase());
                    let hasClash = false;
                    members.forEach(m => {
                        if (clashMap[r.date] && clashMap[r.date][m] && clashMap[r.date][m].length > 1) hasClash = true;
                    });

                    return `
                        <div class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b last:border-b-0 border-slate-100 ${hasClash ? 'bg-rose-50/70 border-l-4 border-rose-500' : 'hover:bg-slate-50/60'} transition">
                            <div class="space-y-1">
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-[#0f2b48] text-sm">${r.category}</span>
                                    <span class="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded">${r.role || 'Member'}</span>
                                    ${r.needs_cover ? '<span class="px-2 py-0.5 bg-rose-100 text-rose-700 text-xs font-bold rounded border border-rose-200">🚨 NEEDS COVER</span>' : ''}
                                </div>
                                <div class="text-sm font-medium text-slate-800">${r.assigned_members}</div>
                                ${r.lesson_title ? `<div class="text-xs text-[#38b2ac] font-bold">📖 Lesson: ${r.lesson_title}</div>` : ''}
                                ${r.passage ? `<div class="text-xs text-slate-500">📜 Passage: ${r.passage}</div>` : ''}
                                ${r.memory_verse ? `<div class="text-xs text-amber-600 font-medium">💡 Verse: ${r.memory_verse}</div>` : ''}
                                ${hasClash ? '<div class="text-xs font-bold text-rose-600">🚨 Double Booking Clash Detected on this date</div>' : ''}
                            </div>
                            <button onclick="openActionModal(${r.id})" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-200 shadow-sm whitespace-nowrap">
                                Swap / Edit
                            </button>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-gradient-to-r from-[#0f2b48] to-[#1a365d] px-5 py-3 text-white flex justify-between items-center">
                            <h3 class="font-bold text-sm tracking-wide flex items-center space-x-2">
                                <span>📅</span>
                                <span>${dateFormatted}</span>
                            </h3>
                            <span class="text-xs bg-[#38b2ac]/20 text-[#38b2ac] px-2.5 py-1 rounded-full font-semibold border border-[#38b2ac]/40">${duties.length} duties</span>
                        </div>
                        <div class="divide-y divide-slate-100">
                            ${dutyRows}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openActionModal(id) {
            const item = allRotas.find(r => r.id === id);
            if (!item) return;

            document.getElementById('editRotaId').value = item.id;
            document.getElementById('modalDetailsLabel').textContent = `${item.date} — ${item.category}`;
            document.getElementById('editMembersInput').value = item.assigned_members;
            document.getElementById('editNeedsCoverCheck').checked = item.needs_cover == 1;

            document.getElementById('actionModal').classList.remove('hidden');
        }

        function closeActionModal() {
            document.getElementById('actionModal').classList.add('hidden');
        }

        async function saveRotaAction() {
            const id = parseInt(document.getElementById('editRotaId').value);
            const newMembers = document.getElementById('editMembersInput').value.trim();
            const needsCover = document.getElementById('editNeedsCoverCheck').checked ? 1 : 0;

            const item = allRotas.find(r => r.id === id);
            if (item) {
                item.assigned_members = newMembers;
                item.needs_cover = needsCover;
            }

            closeActionModal();
            renderUI();

            await runTursoQuery("UPDATE rotas SET assigned_members = ?, needs_cover = ? WHERE id = ?;", [newMembers, needsCover, id]);
        }

        function renderEvents() {
            const container = document.getElementById('eventsContainer');
            const hidePast = document.getElementById('autoDisappearToggle').checked;
            const today = new Date().toISOString().split('T')[0];

            const filtered = allEvents.filter(e => !hidePast || e.date >= today);

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic">No events found.</p>`;
                return;
            }

            container.innerHTML = filtered.map(e => `
                <div class="p-4 border border-slate-200 rounded-xl bg-slate-50 space-y-1">
                    <div class="flex justify-between items-center text-xs text-[#38b2ac] font-bold">
                        <span>${e.date}</span>
                        <span>${e.time || ''}</span>
                    </div>
                    <h4 class="font-bold text-slate-800 text-sm">${e.title}</h4>
                    <p class="text-xs text-slate-600">${e.description || ''}</p>
                </div>
            `).join('');
        }

        async function loadDailyVerse() {
            try {
                const res = await fetch('https://labs.bibleorg.com/api/passage.php?passage=votd&type=json');
                const data = await res.json();
                if (data && data[0]) {
                    document.getElementById('verseText').textContent = `"${data[0].text.replace(/<[^>]*>/g, '').trim()}"`;
                    document.getElementById('verseRef').textContent = `— ${data[0].bookname} ${data[0].chapter}:${data[0].verse}`;
                }
            } catch (err) {}
        }

        function logout() {
            localStorage.removeItem('cbc_user_name');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
