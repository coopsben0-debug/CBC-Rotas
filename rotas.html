<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Rota Management System</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Church Rota Dashboard</h1>
            <div id="auth-status" class="text-sm bg-indigo-700 px-3 py-1 rounded-full">Connected to Supabase</div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Controls & Filters -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <input type="text" id="search-input" placeholder="Search by name or role..." class="border border-gray-300 rounded-lg px-4 py-2 w-full sm:w-80 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex gap-2 w-full sm:w-auto justify-end">
                <button onclick="loadRotas()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition">Refresh Data</button>
            </div>
        </div>

        <!-- Rota Table Container -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Service</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Role</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Assigned Person</th>
                        </tr>
                    </thead>
                    <tbody id="rota-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Populated dynamically via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Initialize Supabase Client (Replace with your actual project URL and anon key)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        let supabaseClient = null;
        if (window.supabase && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let allRotas = [];

        // Fallback mock data if Supabase is not configured or fails
        function getMockRotas() {
            return [
                { id: 1, date: '2026-09-20', service: 'Morning Worship', role: 'Sound Desk', name: 'John Doe' },
                { id: 2, date: '2026-09-20', service: 'Morning Worship', role: 'Welcome Team', name: 'Jane Smith' },
                { id: 3, date: '2026-09-27', service: 'Morning Worship', role: 'Sound Desk', name: 'David Wilson' },
            ];
        }

        // Updated loadRotas function featuring pagination to bypass Supabase's 1,000-row default limit
        async function loadRotas() {
            if (!supabaseClient) {
                allRotas = getMockRotas();
                renderUI();
                return;
            }

            try {
                let allData = [];
                let rangeSize = 1000;
                let from = 0;
                let fetchMore = true;

                // Paginate through Supabase results to ensure no records are truncated past 1,000 rows
                while (fetchMore) {
                    const { data, error } = await supabaseClient
                        .from('rotas')
                        .select('*')
                        .order('date', { ascending: true })
                        .range(from, from + rangeSize - 1);

                    if (error) throw error;

                    if (data && data.length > 0) {
                        allData = allData.concat(data);
                        from += rangeSize;
                        if (data.length < rangeSize) {
                            fetchMore = false;
                        }
                    } else {
                        fetchMore = false;
                    }
                }

                allRotas = allData;
                if (allRotas.length === 0) {
                    allRotas = getMockRotas();
                }
                renderUI();
            } catch (err) {
                console.error('Error fetching rotas from Supabase:', err);
                allRotas = getMockRotas();
                renderUI();
            }
        }

        function renderUI() {
            const tbody = document.getElementById('rota-table-body');
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            tbody.innerHTML = '';

            const filteredData = allRotas.filter(item => {
                const dateStr = (item.date || '').toLowerCase();
                const serviceStr = (item.service || '').toLowerCase();
                const roleStr = (item.role || '').toLowerCase();
                const nameStr = (item.name || '').toLowerCase();
                return dateStr.includes(searchTerm) || 
                       serviceStr.includes(searchTerm) || 
                       roleStr.includes(searchTerm) || 
                       nameStr.includes(searchTerm);
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No rota entries found.</td></tr>`;
                return;
            }

            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.date || ''}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.service || ''}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.role || ''}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-semibold">${item.name || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Event listener for real-time search filtering
        document.getElementById('search-input').addEventListener('input', renderUI);

        // Initial data load on page startup
        window.addEventListener('DOMContentLoaded', loadRotas);
    </script>
</body>
</html>
